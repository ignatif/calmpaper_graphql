version: '3.3'

services:
  db:
    image: postgres:17-alpine
    profiles: ['legacy']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calmpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: ${POSTGRES_DB:-calmpaper}
    ports:
      - '5432:5432'
    volumes:
      - calmpaper_postgres:/var/lib/postgresql/data
  adminer:
    image: adminer:5
    profiles: ['legacy']
    ports:
      - '8081:8080'
    depends_on:
      - db

volumes:
  calmpaper_postgres:
